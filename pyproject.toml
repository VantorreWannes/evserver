[project]
name = "evserver"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wannes Vantorre", email = "vantorrewannes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "dill>=0.4.1",
    "fastapi[standard]>=0.140.7",
    "pydantic>=2.13.4",
]

[project.scripts]
evserver = "evserver:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001", "D419", "D100", "D101", "D102", "D103", "D104", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/unit/**" = ["SLF001"]
